version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reserve-mate-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reserve_mate
      MYSQL_USER: reserve_mate
      MYSQL_PASSWORD: reserve_mate
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:latest
    container_name: reserve-mate-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    command: [ "redis-server", "--appendonly", "yes" ]
volumes:
  mysql_data:
  redis_data: